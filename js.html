<script>
  let alumnes = [];

  const FRANGES_HORARIES = [
    {
      inici: "08:15",
      final: "09:15",
    },

    {
      inici: "09:15",
      final: "10:10",
    },

    {
      inici: "10:35",
      final: "11:35",
    },

    {
      inici: "11:35",
      final: "12:35",
    },

    {
      inici: "12:35",
      final: "13:35",
    },

    {
      inici: "13:35",
      final: "14:35",
    },
  ];

  function carregarAules() {
    google.script.run
      .withSuccessHandler(function (aules) {
        const select = document.getElementById("aula");

        aules.forEach((aula) => {
          let option = document.createElement("option");

          option.value = aula;
          option.textContent = aula;

          select.appendChild(option);
        });
      })
      .withFailureHandler(crearGraellaAlumnesError)
      .obtenirAules();
  }

  function crearGraellaAlumnes(aula = document.getElementById("aula").value) {
    if (!aula) {
      const select = document.getElementById("aula");

      aula = select?.value || localStorage.getItem("ultimaAula");
    }

    // Eliminar taula
    eliminarGraella();

    // Crear loader
    crearLoaderAnell("divAlumnes");
    google.script.run
      .withSuccessHandler(crearGraellaAlumnesCorrectament)
      .withFailureHandler((error) => {
        crearNotificacioError(error.message, "ERROR DEL SERVIDOR");
      })
      .obtenirAlumnes(aula);
  }

  function crearGraellaAlumnesCorrectament(obj) {
    taula = document.createElement("table");
    taula.id = "taulaAlumnes";

    let taulaHeader = document.createElement("thead");
    let taulaBody = document.createElement("tbody");

    let primeraFila = document.createElement("tr");

    // Primera columna
    let cella = document.createElement("th");
    cella.textContent = "Alumne";
    primeraFila.appendChild(cella);

    // Franges horàries
    FRANGES_HORARIES.forEach((hora) => {
      cella = document.createElement("th");
      cella.textContent = `${hora.inici}-${hora.final}`;
      primeraFila.appendChild(cella);
    });

    taulaHeader.appendChild(primeraFila);
    taula.appendChild(taulaHeader);

    alumnes = [];

    // Primera columna: Cognoms + Nom
    for (let i = 1; i < obj.length; i++) {
      console.log("Afegint alumne", i);

      alumnes.push({
        cognom1: obj[i][0],
        cognom2: obj[i][1],
        nom: obj[i][2],
        aula: document.getElementById("aula").value,
        fila: i,
        absent: false,
        horaInici: null,
        horaArribada: null,
        justificat: false,
        telefon1: obj[i][3],
        telefon2: obj[i][4],
        tutor1: obj[i][5],
        tutor2: obj[i][6],
      });

      let fila = document.createElement("tr");

      // Primera columna: Cognoms + Nom
      const cellaNom = document.createElement("td");

      cellaNom.textContent = `${obj[i][0]} ${obj[i][1]}, ${obj[i][2]}`;

      cellaNom.dataset.alumne = obj[i][0] + "|" + obj[i][1] + "|" + obj[i][2];
      cellaNom.dataset.fila = i;
      cellaNom.dataset.aula = document.getElementById("aula").value;

      cellaNom.addEventListener("click", clicarFranja);

      fila.appendChild(cellaNom);

      FRANGES_HORARIES.forEach((franja, index) => {
        const cella = document.createElement("td");

        cella.dataset.alumne = obj[i][0] + "|" + obj[i][1] + "|" + obj[i][2];
        cella.dataset.fila = i;
        cella.dataset.aula = document.getElementById("aula").value;
        cella.dataset.franja = index;

        cella.addEventListener("click", clicarFranja);
        fila.appendChild(cella);
      });

      taulaBody.appendChild(fila);

      // Fila de la barra
      const filaBarra = document.createElement("tr");

      const tdBuida = document.createElement("td");
      tdBuida.textContent = "";
      filaBarra.appendChild(tdBuida);

      // Cel·la que ocupa totes les franges
      const tdBarra = document.createElement("td");
      tdBarra.colSpan = FRANGES_HORARIES.length;
      tdBarra.classList.add("td-barra");

      // Ens servirà per localitzar-la després
      tdBarra.dataset.aula = document.getElementById("aula").value;
      tdBarra.dataset.fila = i;

      filaBarra.appendChild(tdBarra);

      taulaBody.appendChild(filaBarra);
    }

    // Agregem cos a la taula
    taula.appendChild(taulaBody);
    // Agregem estil al header
    taulaHeader.classList.add("table", "table-info", "border-dark", "border-4");
    // Agregem estil a la taula
    taula.classList.add(
      "table",
      "table-striped",
      "table-hover",
      "border",
      "border-dark",
      "border-4",
    );
    // Agregem taula a la pàgina
    document.getElementById("divAlumnes").appendChild(taula);

    // Mostrar notificació de ok
    crearNotificacioOK(
      "mostrat l'alumnat de la classe correctament",
      "Tot en ordre",
    );

    // Eliminem el loader
    eliminarLoader();

    carregarBarresInicials(document.getElementById("aula").value);

    // Actualitzar la taula cada minut
    iniciarActualitzacioBarres();

    document.getElementById("btnEnviarAbsencies").style.display = "block";

    document
      .getElementById("btnEnviarAbsencies")
      .addEventListener("click", enviarAbsenciesSeleccionades);
  }

  function crearGraellaAlumnesError() {
    //crear Loader
    crearLoaderAnell();
    // Mostrar notificació de error
    crearNotificacioError("No s'han pogut mostrar els alumnes", "ERROR");
    // Eliminem el loader
    eliminarLoader();
  }

  function clicarFranja(e) {
    const fila = Number(e.currentTarget.dataset.fila);

    const alumne = alumnes.find((a) => a.fila === fila);

    // 🛑 Si l'alumne ja és absent o ja està registrat avui, no fem res
    if (!alumne || alumne.absent || alumne.isAbsent) return;

    alumne.absent = true;

    iniciarAbsencia(alumne);

    renderitzarAlumne(alumne);
  }

  function iniciarAbsencia(aula, fila) {
    const alumne = alumnes.find((a) => a.aula === aula && a.fila === fila);

    if (!alumne || alumne.absent) return;

    alumne.absent = true;
    alumne.horaInici = new Date();
  }

  function crearBarraProgres(cella) {
    const contenidor = document.createElement("div");
    contenidor.className = "barra-contenidor";

    const barra = document.createElement("div");
    barra.className = "barra-progres";

    contenidor.appendChild(barra);

    cella.appendChild(contenidor);

    return barra;
  }

  function calcularPercentatge(horaArribada) {
    const inici = 8 * 60 + 15;
    const final = 14 * 60 + 35;

    const [hores, minuts] = horaArribada.split(":").map(Number);

    const arribada = hores * 60 + minuts;

    const minutsAbsencia = arribada - inici;

    const percentatge = Math.max(
      0,
      Math.min(100, (minutsAbsencia / (final - inici)) * 100),
    );

    return percentatge;
  }

  function calcularPercentatgeActual() {
    const ara = new Date();

    const minutsActuals = ara.getHours() * 60 + ara.getMinutes();

    const inici = 8 * 60 + 15;
    const final = 14 * 60 + 35;

    return Math.max(
      0,
      Math.min(100, ((minutsActuals - inici) / (final - inici)) * 100),
    );
  }

  let intervalBarra = null;

  function iniciarActualitzacioBarres() {
    if (intervalBarra) {
      clearInterval(intervalBarra);
    }

    actualitzarTotsElsAlumnes();

    intervalBarra = setInterval(actualitzarTotsElsAlumnes, 60000);
  }

  function actualitzarTotsElsAlumnes() {
    document.querySelectorAll(".barra-progres").forEach((barra) => {
      if (barra.dataset.arribat) return;

      const percentatge = calcularPercentatgeActual();

      barra.style.width = percentatge + "%";
      barra.style.backgroundColor = obtenirColorBarra(percentatge);
    });
  }

  function pintarBarra(alumne, percentatge) {
    const barra = crearBarraSiNoExisteix(alumne);

    barra.style.width = percentatge + "%";
    barra.style.backgroundColor = obtenirColorBarra(percentatge);
  }

  function reduirMidaImatge(fitxer, maxAmple = 800, qualitat = 0.5) {
    return new Promise((resolve, reject) => {
      // Si és un PDF o un altre document, el llegim tal com està
      if (!fitxer.type.startsWith("image/")) {
        const lector = new FileReader();
        lector.onload = () =>
          resolve({
            nom: fitxer.name,
            tipus: fitxer.type,
            dades: lector.result,
          });
        lector.onerror = reject;
        lector.readAsDataURL(fitxer);
        return;
      }

      // Si és una imatge, la redimensionem
      const img = new Image();
      const reader = new FileReader();

      reader.onload = (e) => {
        img.src = e.target.result;
      };

      img.onload = () => {
        const canvas = document.createElement("canvas");
        let ample = img.width;
        let alt = img.height;

        // Manté la proporció escalant si supera l'ample màxim
        if (ample > maxAmple) {
          alt = Math.round((alt * maxAmple) / ample);
          ample = maxAmple;
        }

        canvas.width = ample;
        canvas.height = alt;

        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, ample, alt);

        // Exporta com a JPG comprimit
        const dadesComprimit = canvas.toDataURL("image/jpeg", qualitat);

        resolve({
          nom: fitxer.name.replace(/\.[^/.]+$/, "") + ".jpg",
          tipus: "image/jpeg",
          dades: dadesComprimit,
        });
      };

      img.onerror = reject;
      reader.onerror = reject;
      reader.readAsDataURL(fitxer);
    });
  }

  function actualitzarBarra(dades) {
    const alumne = alumnes.find((a) => a.fila == dades.fila);

    if (!alumne) return;

    alumne.horaArribada = dades.hora;

    pintarBarra(alumne, calcularPercentatge(alumne.horaArribada));
  }

  function refrescarGraella(aula) {
    crearGraellaAlumnes(aula);
  }

  function crearBarraSiNoExisteix(alumne) {
    const selector = `.td-barra[data-aula="${alumne.aula}"][data-fila="${alumne.fila}"]`;

    const tdBarra = document.querySelector(selector);

    if (!tdBarra) {
      crearNotificacioError(selector, "No s'ha trobat: ");
      return null;
    }

    let barra = tdBarra.querySelector(".barra-progres");

    if (barra) {
      return barra;
    }

    const contenidor = document.createElement("div");
    contenidor.className = "barra-contenidor";

    barra = document.createElement("div");
    barra.className = "barra-progres";

    contenidor.appendChild(barra);

    tdBarra.appendChild(contenidor);

    return barra;
  }

  function enviarAbsenciesSeleccionades() {
    const boto = document.getElementById("btnEnviarAbsencies");
    const dades = alumnes.filter((alumne) => alumne.absent);

    if (dades.length === 0) {
      crearNotificacioError(
        "No hi ha cap alumne seleccionat.",
        "Sense absències",
      );
      return;
    }

    // 1. Desactivar botó i afegir loader
    if (boto) boto.disabled = true;
    crearLoaderAnell("divAlumnes");

    google.script.run
      .withSuccessHandler(() => {
        eliminarLoader();
        crearNotificacioOK("Absències enviades correctament.", "Tot correcte");

        document.getElementById("divAlumnes").innerHTML = "";
        if (boto) {
          boto.style.display = "none";
          boto.disabled = false; // El restablim per a la pròxima vegada
        }
      })
      .withFailureHandler((error) => {
        eliminarLoader();
        if (boto) boto.disabled = false; // Reactivem si hi ha error per poder reintentar
        crearNotificacioError(error.message, "Error");
      })
      .enviarAbsencies(dades);
  }

  function obtenirAlumne(aula, fila) {
    return new Promise((resolve, reject) => {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(reject)
        .obtenirAlumne(aula, fila);
    });
  }

  function obtenirColorCSS(variableCSS) {
    return getComputedStyle(document.documentElement)
      .getPropertyValue(variableCSS)
      .trim();
  }

  function obtenirColorBarra(percentatge) {
    if (percentatge < 33) {
      return obtenirColorCSS("--color-verd-lima");
    }

    if (percentatge < 66) {
      return obtenirColorCSS("--color-groc-warning");
    }

    return obtenirColorCSS("--color-vermell-bug");
  }

  function eliminarGraella() {
    document.getElementById("taulaAlumnes")?.remove(); // L'operador ?. elimina la taula només si existeix.
  }

  function actualitzarRellotge() {
    const ara = new Date();

    const segons = ara.getSeconds();
    const minuts = ara.getMinutes() + segons / 60;
    const hores = (ara.getHours() % 12) + minuts / 60;

    agullaSegons.style.transform = `translateX(-50%) rotate(${segons * 6}deg)`;

    agullaMinuts.style.transform = `translateX(-50%) rotate(${minuts * 6}deg)`;

    agullaHora.style.transform = `translateX(-50%) rotate(${hores * 30}deg)`;

    const data = ara.toLocaleDateString("ca-ES", {
      weekday: "long",
      day: "2-digit",
      month: "long",
      year: "numeric",
    });

    const hora = ara.toLocaleTimeString("ca-ES");

    document.getElementById("dataHeader").textContent =
      data.charAt(0).toUpperCase() + data.slice(1);

    document.getElementById("horaHeader").textContent = hora;
  }

  ["mousemove", "mousedown", "keydown", "touchstart"].forEach((evento) => {
    document.addEventListener(evento, reiniciarTemporitzador);
  });

  let temporitzador;

  function reiniciarTemporitzador() {
    clearTimeout(temporitzador);

    amagarSalvapantalles();

    temporitzador = setTimeout(
      mostrarSalvapantalles,

      60000,
    );
  }

  function mostrarSalvapantalles() {
    document.getElementById("salvapantalles").classList.add("actiu");
  }

  function amagarSalvapantalles() {
    document.getElementById("salvapantalles").classList.remove("actiu");
  }

  function actualitzarBarraProgresAula(alumnes) {
    const total = alumnes.length;
    if (total === 0) return;

    const numAbsents = alumnes.filter((a) => a.isAbsent).length;
    const numPresents = total - numAbsents;
    const percentatgePresent = Math.round((numPresents / total) * 100);

    // Suposant que tens un contenidor per a la barra de progrés a l'HTML
    const elBarra = document.getElementById("barraProgresAula");
    const elText = document.getElementById("textProgresAula");

    if (elBarra) {
      elBarra.style.width = percentatgePresent + "%";
      // Canviar el color segons l'assistència
      elBarra.style.backgroundColor =
        percentatgePresent > 85 ? "#4CAF50" : "#FF9800";
    }

    if (elText) {
      elText.innerText = `${numPresents}/${total} Alumnes presents (${percentatgePresent}%)`;
    }
  }

  function carregarAlumnesPresents(aula) {
  if (!aula) return;

  google.script.run
    .withSuccessHandler((alumnesPresents) => {
      // Reutilitzem la funció per omplir el selector de Sortida
      omplirAlumnes(alumnesPresents, "Sortida");
    })
    .withFailureHandler((error) => {
      crearNotificacioError("Error carregant alumnes presents: " + error);
    })
    .obtenirAlumnesPresents(aula);
}

  function carregarBarresInicials(aula) {
    crearLoaderAnell("divAlumnes");

    google.script.run
      .withSuccessHandler(function (alumnesAmbProgres) {
        eliminarLoader();

        alumnesAmbProgres.forEach((item) => {
          if (item.percentatge > 0) {
            const filaHTML = item.fila;
            const selector = `.td-barra[data-aula="${aula}"][data-fila="${filaHTML}"]`;
            const tdBarra = document.querySelector(selector);

            if (tdBarra) {
              tdBarra.innerHTML = `
                <div class="barra-contenidor">
                  <div class="barra-progres" style="width: ${item.percentatge}%; background-color: ${obtenirColorBarra(item.percentatge)};"></div>
                </div>
              `;
            }
          }
        });
        crearNotificacioOK("Dades de l'aula actualitzades", "Completat");
      })
      .withFailureHandler(function (err) {
        eliminarLoader();
        crearNotificacioError(err.message, "Error en carregar barres");
      })
      .obtenirAlumnesAmbProgres(aula);
  }
</script>
